    <meta name="theme-color" content="#0B1024" />
    <!-- Favicon & Brand Icons (Google Search, Browsers, iOS, Android) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:image" content="https://www.cybernexasolution.com/logo.png" />
    <meta name="twitter:image" content="https://www.cybernexasolution.com/logo.png" />

    <!-- Organization Schema (Google Search Logo & Knowledge Panel) -->

      "@context": "https://schema.org",

      "url": "https://www.cybernexasolution.com",
      "logo": "https://www.cybernexasolution.com/logo.png"

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "url": "https://www.cybernexasolution.com",

      "alternateName": "CyberNexa"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
